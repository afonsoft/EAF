name: 🛠️ Setup Environments

permissions: {}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to setup'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  setup-environment:
    name: 🛠️ Setup ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
    - name: 🛠️ Setup Environment
      run: |
        echo "🛠️ Setting up ${{ github.event.inputs.environment }} environment"
        echo "Environment setup completed successfully"
