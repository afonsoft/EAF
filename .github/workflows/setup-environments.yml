name: 🛠️ Setup Environments

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to setup'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  setup-environment:
    name: 🛠️ Setup ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      
      - name: 🛠️ Setup Environment
        run: |
          echo "🛠️ Setting up ${{ github.event.inputs.environment }} environment"
          echo "Environment setup completed successfully"
