name: OpenCode

permissions: {}
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.comment.author_association) &&
      (
        github.event.comment.body == '/oc' ||
        startsWith(github.event.comment.body, '/oc ') ||
        github.event.comment.body == '/opencode' ||
        startsWith(github.event.comment.body, '/opencode ')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      OMNIROUTE_BASE_URL: https://omniroute.afonsoft.dev/v1
    steps:
    - name: Checkout repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Run OpenCode
      uses: anomalyco/opencode/github@e5cc278dec9294a627a7b05f47ce6a564408c1a2   # v1.18.5
      env:
        OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        model: omniroute/auto/claude-sonnet
        agent: build
        use_github_token: true
