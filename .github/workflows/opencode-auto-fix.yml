name: OpenCode Auto-Fix

permissions: {}
on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

jobs:
  opencode:
    if: github.event.label.name == 'fix-me'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    env:
      OMNIROUTE_BASE_URL: https://omniroute.afonsoft.dev/v1
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Run OpenCode
      uses: anomalyco/opencode/github@4b7e19e315cca414121ba1d61523fef74bb3ae8b   # v1.18.27
      env:
        OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        model: omniroute/auto/claude-sonnet
        agent: build
        use_github_token: true
        prompt: |
          Fix the issue or implement the feature described.
          Open a pull request with the changes and provide a clear summary.
