x-common-variables: &common-variables
  Database__Provider: ${DATABASE_PROVIDER:-SqlServer}
  Hangfire__IsEnabled: ${HANGFIRE_ENABLED:-false}
  SqlServerCache__IsEnabled: ${SQLSERVERCACHE_ENABLED:-false}
  RedisCache__IsEnabled: ${REDISCACHE_ENABLED:-false}

services:
  eaf-api:
    build:
      context: .
      dockerfile: Templates/Api/Dockerfile
    container_name: ${EAF_API_CONTAINER_NAME:-eaf-api}
    environment:
      <<: *common-variables
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Staging}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Staging}
      ASPNETCORE_URLS: http://+:8001
      ConnectionStrings__Default: ${CONNECTIONSTRINGS_DEFAULT:?CONNECTIONSTRINGS_DEFAULT is required}
      App__ServerRootAddress: ${APP_SERVER_ROOT_ADDRESS:-http://localhost:5000/}
      App__ClientRootAddress: ${APP_CLIENT_ROOT_ADDRESS:-http://localhost:4200/}
      App__CorsOrigins: ${APP_CORS_ORIGINS:-http://localhost:4200}
    ports:
      - "${EAF_API_PORT:-5000}:8001"
    volumes:
      - eaf-api-logs:/app/Logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - eaf-network

  eaf-angular:
    build:
      context: Templates/Angular/Eaf.ProjectName.UI
      dockerfile: dockerfile
    container_name: ${EAF_ANGULAR_CONTAINER_NAME:-eaf-angular}
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      REMOTE_SERVICE_BASE_URL: ${REMOTE_SERVICE_BASE_URL:-http://localhost:5000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4200}
    ports:
      - "${EAF_ANGULAR_PORT:-4200}:80"
    depends_on:
      eaf-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - eaf-network

networks:
  eaf-network:
    driver: bridge

volumes:
  eaf-api-logs:
