# SonarCloud configuration for EAF Framework

sonar.projectKey=afonsoft_EAF2
sonar.organization=afonsoft
sonar.projectName=EAF - Enterprise Application Foundation
sonar.projectDescription=Enterprise Application Foundation using ABP, optimized for .NET 10.0

# Source code
sonar.sources=src/
sonar.tests=test/

# .NET Scanner computes source/tests automatically; properties above are kept for Automatic Analysis compatibility.

# Coverage
sonar.cs.opencover.reportsPaths=TestResults/*/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=TestResults/*.trx

# Exclusions
# Vendor/generated assets and legacy duplicates are excluded to keep analysis
# focused on first-party source code.
sonar.exclusions=**/bin/**,**/obj/**,**/TestResults/**,**/*.Designer.cs,**/Migrations/**,**/node_modules/**,**/dist/**,**/metronic/**,**/scripts.bundle.js,**/eaf-web-resources/Eaf/Framework/scripts/eaf.js,dotnet-install.sh,Templates/Angular/Eaf.ProjectName.UI/src/assets/lib/primeng/**,Templates/Angular/Eaf.ProjectName.UI/src/assets/lib/ngx-bootstrap/**,Templates/Angular/Eaf.ProjectName.UI/src/shared/service-proxies/service-proxies.ts
sonar.cpd.exclusions=Templates/**
sonar.test.exclusions=**/bin/**,**/obj/**,**/node_modules/**

# Encoding
sonar.sourceEncoding=UTF-8

# .NET specific
sonar.dotnet.excludeGeneratedCode=true
