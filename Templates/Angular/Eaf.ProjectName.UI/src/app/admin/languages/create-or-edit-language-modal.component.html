<div
  bsModal
  #createOrEditModal="bs-modal"
  class="modal fade"
  tabindex="-1"
  aria-labelledby="createOrEditModal"
  [config]="{ backdrop: 'static' }"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      @if (active) {
      <form autocomplete="off" #editForm="ngForm" novalidate (ngSubmit)="save()">
        <div class="modal-header">
          <h4 class="modal-title">
            @if (language.id) {
            <span>{{ 'Edit' | localize }}: {{ language.name }}</span>
            } @if (!language.id) {
            <span>{{ 'Create' | localize }}</span>
            }
          </h4>
          <button type="button" class="close" (click)="close()" [attr.aria-label]="l('Close')">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <select
              #languageCombobox
              id="languageName"
              name="languageName"
              class="form-control"
              aria-label="{{ 'LanguageName' | localize }}"
              [(ngModel)]="language.name"
              required
            >
              <option value="">{{ 'emptyText' | localize }}</option>
              @for (languageName of languageNames; track languageName) {
              <option [value]="languageName.value">{{ languageName.displayText }}</option>
              }
            </select>
            <validation-messages [formCtrl]="languageCombobox"></validation-messages>
          </div>
          <div class="form-group">
            <select
              #iconCombobox
              id="languageIcon"
              name="languageIcon"
              class="form-control"
              aria-label="{{ 'LanguageIcon' | localize }}"
              [(ngModel)]="language.icon"
            >
              <option value="">{{ 'emptyText' | localize }}</option>
              @for (flag of flags; track flag) {
              <option [value]="flag.value" [attr.data-icon]="flag.value">{{ flag.displayText }}</option>
              }
            </select>
          </div>
          <div class="m-checkbox-list">
            <label for="EditLanguage_IsEnabled" class="m-checkbox">
              <input id="EditLanguage_IsEnabled" type="checkbox" name="languageIsEnabled" [(ngModel)]="language.isEnabled" />
              {{ 'Active' | localize }}
              <span></span>
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button [disabled]="saving" type="button" class="btn btn-default" (click)="close()">{{ 'Cancel' | localize }}</button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="!editForm.form.valid"
            [buttonBusy]="saving"
            [busyText]="l('SavingWithThreeDot')"
          >
            <i class="fa fa-save"></i> <span>{{ 'Save' | localize }}</span>
          </button>
        </div>
      </form>
      }
    </div>
  </div>
</div>
