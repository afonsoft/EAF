<div class="form-group mb-2">
  <label for="KeyValueListManagerKey">{{ header }}</label>
  <div class="input-group">
    <input
      id="KeyValueListManagerKey"
      type="text"
      class="form-control"
      [(ngModel)]="addOrEditKey"
      placeholder="{{ keyPlaceHolder }}"
      (change)="onKeyChange()"
    />
    <input
      type="text"
      id="KeyValueListManagerValue"
      class="form-control"
      [(ngModel)]="addOrEditValue"
      placeholder="{{ valuePlaceHolder }}"
      aria-label="{{ valuePlaceHolder }}"
    />
    <div class="input-group-append">
      <button class="btn btn-primary" (click)="addOrEdit()" type="button">
        @if (!isEdit) {
        <span>{{ 'Add' | localize }}</span>
        } @if (isEdit) {
        <span>{{ 'Edit' | localize }}</span>
        }
      </button>
    </div>
  </div>
  @if (items) {
  <div class="key-value-items-list">
    @for (keyValueItem of items; track keyValueItem) {
    <div
      class="alert alert-custom alert-bold m-1"
      [class.alert-white]="addOrEditKey !== keyValueItem.key"
      [class.alert-warning]="addOrEditKey === keyValueItem.key"
      role="alert"
    >
      <div class="alert-text">"{{ keyValueItem.key }}" : "{{ keyValueItem.value }}"</div>
      <div class="alert-close">
        <button type="button" class="close" data-dismiss="alert" [attr.aria-label]="l('Edit')" (click)="openItemEdit(keyValueItem)">
          <span aria-hidden="true"><i class="la la-edit fa-1x"></i></span>
        </button>
        <button type="button" class="close" data-dismiss="alert" [attr.aria-label]="l('Delete')" (click)="removeItem(keyValueItem)">
          <span aria-hidden="true"><i class="la la-close fa-1x"></i></span>
        </button>
      </div>
    </div>
    }
  </div>
  }
</div>
