<div [@routerTransition]>
  <!-- BEGIN: Header -->
  <header mHeader #mHeader role="banner" aria-label="{{ 'MainHeader' | localize }}" class="m-grid__item m-header m-header--skin-{{ currentTheme.baseSettings.header.headerSkin }}">
    <div class="m-header__top">
      <div class="m-container {{ ui.getContainerClass() }} m-container--xxl m-container--full-height">
        <div class="m-stack m-stack--ver m-stack--desktop">
          <!-- BEGIN: Brand -->
          <!-- END: Brand -->
          <div
            class="m-stack__item m-stack__item--fluid m-header-head m-brand--skin-{{
              currentTheme.baseSettings.header.headerSkin
            }} d-print-none"
            id="m_header_nav"
          >
            <titlebar></titlebar>
            <topbar></topbar>
          </div>
        </div>
      </div>
    </div>
  </header>
  <!-- END: Header -->
  <!-- begin::Body -->
  <div class="m-grid__item m-grid__item--fluid m-grid m-grid--ver-desktop m-grid--desktop m-body m-page__container">
    <!-- BEGIN: Left Aside -->

    <aside id="m_aside_left" #mAsideLeft [class]="'m-grid__item m-aside-left m-aside-left--skin-' + currentTheme.baseSettings.menu.asideSkin" role="complementary" aria-label="{{ 'SidebarMenu' | localize }}">
      <div class="m-brand m-brand--skin-{{ currentTheme.baseSettings.menu.asideSkin }}">
        <a routerLink="/" class="m-brand__logo">
          <img [src]="defaultLogo" alt="{{ 'ApplicationLogo' | localize }}" height="38" />
        </a>
      </div>

      <!-- BEGIN: Aside Menu -->
      <side-bar-menu *ngIf="currentTheme.isLeftMenuUsed"></side-bar-menu>
      <!-- END: Aside Menu -->
    </aside>

    <main class="m-grid__item m-grid__item--fluid m-wrapper" role="main">
      <router-outlet></router-outlet>
    </main>
  </div>
  <!-- end:: Body -->
</div>
