version: '3.4'

services:
  eaf.projectname.web.host:
    image: ${DOCKER_REGISTRY-}eafprojectnamewebhost
    build:
      context: ../..
      dockerfile: Templates/Api/Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.0'
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/data-protection-keys
    networks:
      - eaf-network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  eaf-network:
    driver: bridge
